# OPTIONAL — faster updates via a prebuilt image.
# The default deploy (deploy/setup.sh) builds the image on the VPS from source,
# so nothing here is required. To switch to prebuilt images:
#   1. Copy this file to .github/workflows/docker.yml via the GitHub web UI
#      (Add file → Create new file). Pushing it over git needs the `workflow`
#      token scope, which the web editor has by default.
#   2. Tag a release → the image lands at ghcr.io/lamvukms-code/dnd-table.
#   3. Make that package Public (github.com/users/lamvukms-code/packages).
#   4. In deploy/docker-compose.yml replace the `app.build:` block with
#      `image: ghcr.io/lamvukms-code/dnd-table:latest` and change setup.sh's
#      last step to `docker compose pull && docker compose up -d`.

name: docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
