name: dndtable

# Run from the repo: deploy/setup.sh clones it to /opt/dndtable/src and runs
#   docker compose -f src/deploy/docker-compose.yml up -d --build
# `Caddyfile` next to this file is generated by setup.sh (git-ignored).
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dndtable-app:local
    restart: unless-stopped
    expose:
      - "8787"
    volumes:
      - data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  caddy_data:
  caddy_config:
