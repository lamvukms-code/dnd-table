name: dndtable

# Run from the repo: deploy/setup.sh clones it to /opt/dndtable/src and runs
#   docker compose -f src/deploy/docker-compose.yml up -d --build
# `Caddyfile` next to this file is generated by setup.sh (git-ignored).
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dndtable-app:local
    restart: unless-stopped
    expose:
      - "8787"
    volumes:
      - data:/data
    # Hardening: no extra privileges, tight resource caps (also blunts crypto-miners).
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    pids_limit: 128
    logging: *logs

volumes:
  data:
  caddy_data:
  caddy_config:
